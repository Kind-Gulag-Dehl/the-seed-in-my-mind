[workspace]
members = [
  "crates/common",
  "crates/encoding",
  "crates/identity",
  "crates/event-log",
  "crates/idea-graph",
  "crates/replay",
  "crates/snapshot",
  "crates/provenance",
  "crates/verification",
  "crates/storage",
  "crates/api-types-canonical",
  "crates/api",
  "crates/tooling",
  "crates/tests",
  "bins/api-server",
  "bins/replay-worker",
  "bins/snapshot-builder",
  "bins/snapshot-verify",
  "bins/payload-hash-seeder",
  "bins/seed-pack-builder",
  "bins/seed-importer",
  "bins/curator-admin",
  "bins/verify-replay",
]
# Stage0 production/default workflows intentionally exclude stage1 experimental stubs.
default-members = [
  "crates/common",
  "crates/encoding",
  "crates/identity",
  "crates/event-log",
  "crates/replay",
  "crates/snapshot",
  "crates/provenance",
  "crates/storage",
  "crates/api-types-canonical",
  "crates/api",
  "crates/tooling",
  "crates/tests",
  "bins/api-server",
  "bins/snapshot-builder",
  "bins/snapshot-verify",
  "bins/payload-hash-seeder",
  "bins/seed-importer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "derive"] }
thiserror = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["serde", "v4", "v7"] }

